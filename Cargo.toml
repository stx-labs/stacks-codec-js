[package]
name = "stacks-encoding-native-js"
version = "0.1.0"
# Native binary statically links GPL-3.0 code from stacks-network/stacks-core.
license = "GPL-3.0"
edition = "2021"
exclude = ["index.node"]
resolver = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"

[profile.release-dev]
inherits = "release"
debug = true
incremental = true

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
# === Upstream canonical wire-format implementations ===
# These three crates are pinned via the helper script `scripts/update-stacks-core.sh`.
# Together they own all on-chain consensus serialization for Stacks: transactions,
# blocks (2.x + Nakamoto), Clarity values, post-conditions, and addresses.
#
# `stacks-codec` currently re-exports the StacksMessageCodec trait + helpers from
# stacks-common. As upstream PRs (e.g. stacks-network/stacks-core#7200) land, more
# of the actual wire-format types will move into this crate; the decode functions
# here will follow them.
#
# IMPORTANT: keep the rev pin in sync across all three deps. The update script
# enforces this.
stacks-codec = { git = "https://github.com/stacks-network/stacks-core", rev = "ca46d23f6fd97ef1a16d23a9966d20c94c19765d" }
stacks_common = { package = "stacks-common", git = "https://github.com/stacks-network/stacks-core", rev = "ca46d23f6fd97ef1a16d23a9966d20c94c19765d", default-features = false }
clarity = { git = "https://github.com/stacks-network/stacks-core", rev = "ca46d23f6fd97ef1a16d23a9966d20c94c19765d", default-features = false }
stackslib = { git = "https://github.com/stacks-network/stacks-core", rev = "ca46d23f6fd97ef1a16d23a9966d20c94c19765d" }

# === This crate's own dependencies ===
git-version = "0.3.5"
lazy_static = "1.4.0"
unicode-segmentation = "1.9.0"
regex = "1.5"
# Used by the PoX synthetic-event decoder (no upstream equivalent).
bech32 = "0.11"
# Hex helpers. Re-exported from stacks-common eventually, but we keep this so
# the local `hex` helpers (with their SIMD path) stay available.
hex = { version = "0.4", default-features = false, features = ["alloc"] }
byteorder = "1.4.3"

[target.'cfg(all(any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64"), not(target_env = "msvc")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(any(not(any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64")), target_env = "msvc"))'.dependencies]
sha2 = { version = "0.10" }

[dependencies.neon]
version = "1.0.0"
default-features = false
features = ["napi-6"]

[dev-dependencies]
flate2 = "1.0.22"
# Pull from upstream so we use the same hex helpers as the canonical impls.
hex = "0.4"
