name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.3.0 or 1.3.0-beta.0)'
        required: true
        type: string

jobs:
  verify:
    # Only `main` may be released, and the checked-out commit must already carry the requested
    # version so the artifacts and the tag can never disagree.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Check package version matches the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          actual="$(jq -r .version package.json)"
          if [[ "$actual" != "$VERSION" ]]; then
            echo "::error::package.json is at $actual but release $VERSION was requested (commit ${GITHUB_SHA})"
            exit 1
          fi

      - name: Check tag does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag v${VERSION} already exists; it must be created by publishing the draft release"
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install deps
        run: npm ci --audit=false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: native

      - name: Position downloaded artifacts
        run: |
          mkdir -p ./native
          find ./native -mindepth 2 -type f -exec mv -t ./native -i '{}' +
          find ./native -mindepth 1 -type d -empty -delete
          ls -R ./native

      - name: Publish to npm
        run: |
          VERSION="${{ inputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            # Extract the prerelease identifier (e.g. "next" from "9.0.0-next.30")
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
            npm publish --provenance --access public --tag "$TAG"
          else
            npm publish --provenance --access public
          fi

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Create draft GitHub Release (tag is created on publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if echo "$VERSION" | grep -q "-"; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # No tag is created for a draft; GitHub creates `v$VERSION` at
          # `$GITHUB_SHA` when the draft is published.
          gh release create "v$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --generate-notes \
            $PRERELEASE_FLAG
